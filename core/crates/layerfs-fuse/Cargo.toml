[package]
name = "layerfs-fuse"
description = "Native Workspace connection and bounded request service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-overlay = { path = "../layerfs-overlay" }
layerfs-workspace = { path = "../layerfs-workspace" }
layerfs-content = { path = "../layerfs-content" }

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", features = ["windows-61", "notify"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false }
libc = "=0.2.189"
nix = { version = "=0.31.3", features = ["fs", "mount", "feature"] }
